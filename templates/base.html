<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobBot India</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <div class="brand">JobBot 🇮🇳</div>
    <div class="nav-links">
      <a href="{{ url_for('index') }}">Dashboard</a>
      <a href="{{ url_for('report') }}">Applied Report</a>
      <a href="{{ url_for('profile_page') }}">Profile & Data</a>
      <a href="{{ url_for('portals') }}">Company Portals</a>
    </div>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>

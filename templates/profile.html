{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Your Profile & Application Data</h2>
  <form method="POST" action="{{ url_for('profile_page') }}" enctype="multipart/form-data" class="profile-form">

    <label>Full Name</label>
    <input type="text" name="full_name" value="{{ profile.full_name }}">

    <label>Email</label>
    <input type="email" name="email" value="{{ profile.email }}">

    <label>Phone</label>
    <input type="text" name="phone" value="{{ profile.phone }}">

    <label>Current Company</label>
    <input type="text" name="current_company" value="{{ profile.current_company }}">

    <label>Total Experience (years)</label>
    <input type="number" step="0.1" name="total_experience_years" value="{{ profile.total_experience_years }}">

    <label>Current CTC</label>
    <input type="text" name="current_ctc" value="{{ profile.current_ctc }}" placeholder="e.g. 12 LPA">

    <label>Expected CTC</label>
    <input type="text" name="expected_ctc" value="{{ profile.expected_ctc }}" placeholder="e.g. 18 LPA">

    <label>Notice Period (days)</label>
    <input type="number" name="notice_period_days" value="{{ profile.notice_period_days }}">

    <label>LinkedIn URL</label>
    <input type="url" name="linkedin_url" value="{{ profile.linkedin_url }}">

    <label>Portfolio / Website URL</label>
    <input type="url" name="portfolio_url" value="{{ profile.portfolio_url }}">

    <label>Cover Letter Template (use {job_title}, {company}, {full_name})</label>
    <textarea name="cover_letter_template" rows="6">{{ profile.cover_letter_template }}</textarea>

    <hr>

    <label>Default Search Keywords (comma separated)</label>
    <input type="text" name="keywords" value="{{ profile.keywords }}">

    <label>Preferred Cities (comma separated, editable anytime)</label>
    <input type="text" name="preferred_cities" value="{{ profile.preferred_cities }}">

    <label>Minimum experience filter (years, 0 = no filter)</label>
    <input type="number" step="0.1" name="min_experience" value="{{ profile.min_experience }}">

    <hr>

    <label>Resume (PDF)</label>
    {% if profile.resume_filename %}
      <p class="note">Current file: {{ profile.resume_filename }}</p>
    {% endif %}
    <input type="file" name="resume" accept="application/pdf">

    <button type="submit" class="btn btn-primary">Save Profile</button>
  </form>
</div>
{% endblock %}

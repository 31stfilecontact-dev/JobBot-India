name: Daily JobBot India Automation

on:
  schedule:
    # Runs at 03:30 UTC daily (09:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'dry_run'
        type: choice
        options:
          - dry_run
          - apply
      pages:
        description: 'Search Pages Depth'
        required: false
        default: '1'
        type: string

jobs:
  run-jobbot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & Browser Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Automated JobBot Discovery & Auto-Apply
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          FLASK_SECRET: ${{ secrets.FLASK_SECRET || 'github-actions-secret' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'dry_run' }}"
          PAGES="${{ github.event.inputs.pages || '1' }}"
          python scripts/run_bot.py --mode "$MODE" --pages "$PAGES"

      - name: Upload Screenshot Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobbot-application-screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 14
